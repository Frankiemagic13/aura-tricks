# XcodeGen project file. On your Mac:
#   brew install xcodegen
#   cd ios/Gallery && xcodegen
# Then open Gallery.xcodeproj
name: Gallery
options:
  bundleIdPrefix: com.frankievalletech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gallery:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Photos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Photos shows your library.
        NSMicrophoneUsageDescription: Photos uses the microphone for voice search.
        NSSpeechRecognitionUsageDescription: Photos uses speech recognition for voice search.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankievalletech.gallery
