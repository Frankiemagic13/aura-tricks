<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Calculator</title>
<style>
/* All sizes use --u = 1 point of an iPhone 16 Pro (402 pt wide), scaled to the width of the current phone.
   If the keys and top bar (about 560 pt) do not fit the height, the height limits the scale. */
:root{--u:min(calc(100vw / 402),calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 110px) / 560))}
@supports (height:100dvh){:root{--u:min(calc(100vw / 402),calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 110px) / 560))}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;overscroll-behavior:none;
  font-family:-apple-system,system-ui,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:calc(402 * var(--u));max-width:100vw;
  display:flex;flex-direction:column;
  padding:max(env(safe-area-inset-top),calc(20 * var(--u))) calc(16 * var(--u)) calc(env(safe-area-inset-bottom) + 28 * var(--u))}
.top{height:calc(44 * var(--u));display:flex;align-items:center;justify-content:space-between;flex:none}
.tb{width:calc(44 * var(--u));height:calc(44 * var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#232323,#161616);
  box-shadow:inset 0 0 0 calc(.6 * var(--u)) rgba(255,255,255,.09),inset 0 calc(.8 * var(--u)) calc(.6 * var(--u)) rgba(255,255,255,.08)}
.tb svg{width:calc(26 * var(--u));height:calc(26 * var(--u))}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;
  padding:0 calc(3 * var(--u)) calc(18 * var(--u)) calc(4 * var(--u))}
#expr{text-align:right;color:#8D8D92;font-weight:400;height:calc(40 * var(--u));line-height:calc(40 * var(--u));white-space:nowrap;overflow:hidden}
#main{text-align:right;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:calc(-.5 * var(--u));font-variant-numeric:tabular-nums}

.keys{display:grid;grid-template-columns:repeat(4,calc(86.5 * var(--u)));grid-auto-rows:calc(86.5 * var(--u));
  column-gap:calc(7.83 * var(--u));row-gap:calc(8.7 * var(--u));flex:none}
.k{position:relative;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff;
  font:500 calc(37 * var(--u))/1 -apple-system,system-ui,"SF Pro Display",sans-serif;
  background:linear-gradient(180deg,#383838 0%,#333333 45%,#303030 100%);
  box-shadow:inset 0 calc(1 * var(--u)) calc(.8 * var(--u)) rgba(255,255,255,.10),
             inset 0 0 0 calc(.7 * var(--u)) rgba(255,255,255,.055),
             inset 0 calc(-1 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.25);
  transition:filter .35s ease-out,transform .35s cubic-bezier(.3,1.5,.5,1)}
.k.f{background:linear-gradient(180deg,#6A6A6A 0%,#636363 45%,#5D5D5D 100%);
  box-shadow:inset 0 calc(1 * var(--u)) calc(.8 * var(--u)) rgba(255,255,255,.16),
             inset 0 0 0 calc(.7 * var(--u)) rgba(255,255,255,.07),
             inset 0 calc(-1 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.2)}
.k.o{background:linear-gradient(180deg,#F4A345 0%,#F09C3B 45%,#EC9634 100%);
  box-shadow:inset 0 calc(1 * var(--u)) calc(.8 * var(--u)) rgba(255,255,255,.22),
             inset 0 0 0 calc(.7 * var(--u)) rgba(255,255,255,.08),
             inset 0 calc(-1 * var(--u)) calc(1 * var(--u)) rgba(120,60,0,.18)}
.k.o.sel{background:linear-gradient(180deg,#FFFFFF,#F2F2F2);color:#F09C3B}
.k.o.sel svg *{stroke:#F09C3B}.k.o.sel svg circle{fill:#F09C3B}
.k.down{transition:filter .04s,transform .12s ease-out;filter:brightness(1.55);transform:scale(1.04)}
.k.o.down{filter:brightness(1.18)}
.k svg{display:block;pointer-events:none}
.k .g29{width:calc(29 * var(--u));height:calc(29 * var(--u))}
.k .g22{width:calc(22 * var(--u));height:calc(22 * var(--u))}
.k .bk{width:calc(37 * var(--u));height:calc(31 * var(--u))}
.k .pm{width:calc(36 * var(--u));height:calc(36 * var(--u))}
.k .pct{width:calc(36 * var(--u));height:calc(36 * var(--u))}
.k .dot{width:calc(6 * var(--u));height:calc(6 * var(--u));margin-top:calc(20 * var(--u))}
.k.ac{font-size:calc(36 * var(--u));letter-spacing:calc(-.3 * var(--u))}

/* secret settings sheet */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#1C1C1E;border-radius:28px 28px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  max-height:88%;overflow-y:auto;max-width:520px;margin:0 auto}
.open #sheetBg{opacity:1;pointer-events:auto}.open #sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:#48484A;margin:0 auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shead b{font-size:17px;font-weight:600}.shead span{width:60px}
.done{color:#FF9F0A;font-size:17px;font-weight:600;background:none;border:0;width:60px;text-align:right;font-family:inherit}
.lbl{font-size:13px;color:rgba(235,235,245,.6);text-transform:uppercase;margin:16px 16px 6px}
.grp{background:#2C2C2E;border-radius:14px;overflow:hidden}
.r{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;font-size:17px;position:relative}
.r+.r::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:rgba(84,84,88,.65)}
.seg{display:flex;background:rgba(118,118,128,.24);border-radius:10px;padding:2px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:#fff;font:500 14px -apple-system,system-ui;height:32px;border-radius:8px}
.seg button.on{background:#636366;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.r input{background:none;border:0;color:#fff;font:17px -apple-system,system-ui;text-align:right;outline:none;width:60%;-webkit-user-select:text;user-select:text}
.r select{background:none;border:0;color:rgba(235,235,245,.6);font:17px -apple-system,system-ui;text-align:right;outline:none;-webkit-appearance:none;appearance:none}
.step{display:flex;align-items:center;gap:12px}
.step button{width:34px;height:30px;border:0;border-radius:8px;background:rgba(118,118,128,.24);color:#fff;font-size:20px;line-height:1}
.step em{font-style:normal;min-width:22px;text-align:center}
.note{font-size:13px;color:rgba(235,235,245,.6);margin:8px 16px 0;line-height:1.35}
.preview{font-size:13px;color:#FF9F0A;margin:8px 16px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="tb"><svg viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="10.6"/><path d="M13 6.8V13H8.6"/></svg></div>
    <div class="tb"><svg viewBox="0 0 26 26" fill="none"><rect x="5.6" y="2.4" width="14.8" height="21.2" rx="3.4" stroke="#fff" stroke-width="2.1"/><rect x="8.4" y="5.2" width="9.2" height="3.6" rx=".9" fill="#fff"/>
      <g fill="#fff"><circle cx="9.3" cy="12.2" r="1.25"/><circle cx="13" cy="12.2" r="1.25"/><circle cx="16.7" cy="12.2" r="1.25"/><circle cx="9.3" cy="15.6" r="1.25"/><circle cx="13" cy="15.6" r="1.25"/><circle cx="16.7" cy="15.6" r="1.25"/><circle cx="9.3" cy="19" r="1.25"/><circle cx="13" cy="19" r="1.25"/><circle cx="16.7" cy="19" r="1.25"/></g></svg></div>
  </div>
  <div class="disp"><div id="expr"></div><div id="main">0</div></div>
  <div class="keys" id="keys">
    <button class="k f" data-k="bk"><svg class="bk" viewBox="0 0 37 31" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M13 3.5h18a3.5 3.5 0 0 1 3.5 3.5v17a3.5 3.5 0 0 1-3.5 3.5H13L2.5 15.5z"/><path d="m17.5 10.5 10 10M27.5 10.5l-10 10"/></svg></button>
    <button class="k f ac" data-k="clr">AC</button>
    <button class="k f" data-k="pct"><svg class="pct" viewBox="0 0 36 36" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><ellipse cx="8.5" cy="9" rx="4.6" ry="5.8"/><ellipse cx="27.5" cy="27" rx="4.6" ry="5.8"/><path d="M27 3.2 9 32.8"/></svg></button>
    <button class="k o" data-k="÷"><svg class="g29" viewBox="0 0 29 29" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M1.8 14.5h25.4"/><circle cx="14.5" cy="5.4" r="2.5" fill="#fff" stroke="none"/><circle cx="14.5" cy="23.6" r="2.5" fill="#fff" stroke="none"/></svg></button>
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
    <button class="k o" data-k="×"><svg class="g22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M2 2l18 18M20 2 2 20"/></svg></button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
    <button class="k o" data-k="−"><svg class="g29" viewBox="0 0 29 29" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M1.8 14.5h25.4"/></svg></button>
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
    <button class="k o" data-k="+"><svg class="g29" viewBox="0 0 29 29" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M1.8 14.5h25.4M14.5 1.8v25.4"/></svg></button>
    <button class="k" data-k="neg"><svg class="pm" viewBox="0 0 36 36" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round"><path d="M1.8 8.4h10.4M7 3.2v10.4M22.5 4.5 8.5 33M23.5 28.6h10.4"/></svg></button>
    <button class="k" data-k="0" id="zero">0</button>
    <button class="k" data-k="."><svg class="dot" viewBox="0 0 6 6"><circle cx="3" cy="3" r="3" fill="#fff"/></svg></button>
    <button class="k o" data-k="="><svg class="g29" viewBox="0 0 29 29" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M2.2 9.6h24.6M2.2 19.4h24.6"/></svg></button>
  </div>
</div>

<div id="sheetBg"></div>
<div id="sheet">
  <div class="grab"></div>
  <div class="shead"><span></span><b>Settings</b><button class="done" id="done">Done</button></div>
  <div class="seg" id="mode"><button data-v="date">Date &amp; Time</button><button data-v="custom">Custom</button><button data-v="off">Off</button></div>
  <div id="customBox">
    <div class="lbl">Force result</div>
    <div class="grp"><div class="r">Number<input id="custom" inputmode="numeric" pattern="[0-9]*" placeholder="0"></div></div>
    <div class="note">The total of the numbers before the force must be smaller than this number.</div>
  </div>
  <div id="dateBox">
    <div class="lbl">Date &amp; time</div>
    <div class="grp">
      <div class="r">Format<select id="fmt">
        <option value="odhm">MMDD hhmm (12 h)</option><option value="odHm">MMDD HHmm (24 h)</option>
        <option value="dohm">DDMM hhmm (12 h)</option><option value="doHm">DDMM HHmm (24 h)</option>
        <option value="hmod">hhmm MMDD (12 h)</option><option value="odY">MMDDYYYY</option><option value="hm">hhmm only</option>
      </select></div>
      <div class="r">Add minutes<div class="step"><button data-s="a" data-d="-1">−</button><em id="aV">1</em><button data-s="a" data-d="1">+</button></div></div>
    </div>
    <div class="preview" id="prev"></div>
  </div>
  <div class="lbl">Force</div>
  <div class="grp"><div class="r">Start after numbers<div class="step"><button data-s="n" data-d="-1">−</button><em id="nV">3</em><button data-s="n" data-d="1">+</button></div></div></div>
  <div class="note">The force starts when + is tapped after the last number. AC makes the force ready again.</div>
</div>

<script>
const Q=new URLSearchParams(location.search);
const S={mode:Q.get('mode')||'date',custom:Q.get('r')||'',fmt:Q.get('f')||'odhm',
  a:Q.has('a')?(parseInt(Q.get('a'),10)||0):1,n:Math.max(1,parseInt(Q.get('n')??'3',10)||3)};
try{Object.assign(S,JSON.parse(localStorage.getItem('cset')||'{}'))}catch(e){}
if(Q.has('r')){S.mode='custom';S.custom=Q.get('r')}
function saveS(){try{localStorage.setItem('cset',JSON.stringify(S))}catch(e){}}

const p2=v=>String(v).padStart(2,'0');
function dateTarget(){const d=new Date(Date.now()+S.a*60000);let s='';
  for(const c of S.fmt){
    if(c==='o')s+=p2(d.getMonth()+1);else if(c==='d')s+=p2(d.getDate());
    else if(c==='h')s+=p2(d.getHours()%12||12);else if(c==='H')s+=p2(d.getHours());
    else if(c==='m')s+=p2(d.getMinutes());else if(c==='y')s+=p2(d.getFullYear()%100);else if(c==='Y')s+=d.getFullYear()}
  return Number(s)}
function target(){return S.mode==='custom'?Number(S.custom):S.mode==='date'?dateTarget():NaN}

let toks=[],cur='',result=null,shownExpr='',armed=true,force=null,fi=0,before=0;
const OPS=['+','−','×','÷'],isOp=t=>OPS.includes(t);
function evalToks(t){const a=t.map(x=>isOp(x)?x:parseFloat(x));if(a.length&&isOp(a.at(-1)))a.pop();
  const b=[];for(let i=0;i<a.length;i++){if(a[i]==='×'||a[i]==='÷'){const l=b.pop(),op=a[i],r=a[++i];b.push(op==='×'?l*r:(r===0?NaN:l/r))}else b.push(a[i])}
  let v=b[0]??0;for(let i=1;i<b.length;i+=2)v=b[i]==='+'?v+b[i+1]:v-b[i+1];return v}
function fmtNum(s){if(s===''||s==null)return'';
  if(typeof s==='number'){if(!isFinite(s))return'Error';s=Math.abs(s)>=1e16?s.toExponential(6).replace('e+','e'):String(+s.toPrecision(12))}
  if(/e/.test(s))return s;const neg=s.startsWith('-');if(neg)s=s.slice(1);
  let[i,f]=s.split('.');i=(i||'0').replace(/\B(?=(\d{3})+(?!\d))/g,',');return(neg?'-':'')+i+(f!==undefined?'.'+f:'')}
const exprStr=t=>t.map(x=>isOp(x)?x:fmtNum(x)).join('');

const $m=document.getElementById('main'),$e=document.getElementById('expr');
function unit(){return parseFloat(getComputedStyle(document.getElementById('keys')).gridAutoRows)/86.5||1}
function fit(el,max,min){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>el.clientWidth&&s>min){s-=1;el.style.fontSize=s+'px'}}
function render(){
  let main;
  if(result!==null){main=fmtNum(result);$e.textContent=shownExpr}
  else{const t=toks.concat(cur!==''?[cur]:[]);main=t.length?exprStr(t):'0';$e.textContent=''}
  $m.textContent=main;const u=unit();fit($m,68*u,30*u);fit($e,30*u,16*u);
  document.querySelectorAll('.k.o').forEach(b=>b.classList.toggle('sel',result===null&&cur===''&&toks.length>0&&toks.at(-1)===b.dataset.k))}
function computeForce(){const need=target()-before;
  if(Number.isFinite(need)&&need>0&&Number.isInteger(need)){force=String(need);fi=Math.min(fi,force.length);if(fi)cur=force.slice(0,fi)}else force=null}
function startForce(){before=evalToks(toks.slice(0,-1));fi=0;computeForce()}
function reset(){toks=[];cur='';result=null;shownExpr='';armed=true;force=null;fi=0}

function press(k){
  if(k==='clr'){reset();return render()}
  if(k==='bk'){
    if(result!==null)return;
    if(force!==null&&cur!==''){fi=Math.max(0,fi-1);cur=force.slice(0,fi)}
    else if(cur!=='')cur=cur.slice(0,-1);
    else if(toks.length){const t=toks.pop();if(!isOp(t))cur=t.slice(0,-1);else if(force!==null){force=null;armed=true}}
    return render()}
  if(result!==null&&(/\d/.test(k)||k==='.'))reset();
  if(/^\d$/.test(k)){
    if(force!==null){if(fi<force.length){fi++;cur=force.slice(0,fi)}return render()}
    if(cur==='0')cur='';if(cur==='-0')cur='-';if(cur.replace(/[-.]/g,'').length>=9)return;cur+=k;return render()}
  if(k==='.'){if(force!==null)return;if(!cur.includes('.'))cur=(cur===''||cur==='-'?cur+'0':cur)+'.';return render()}
  if(k==='neg'){if(force!==null)return;
    if(result!==null){const r=result;reset();cur=String(-r)}else if(cur!=='')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;else cur='-0';return render()}
  if(k==='pct'){if(force!==null)return;
    if(result!==null){const r=result;reset();cur=String(r/100)}else if(cur!=='')cur=String(parseFloat(cur)/100);return render()}
  if(isOp(k)){
    if(force!==null){cur=force;force=null}
    if(result!==null){const r=result;reset();toks=[String(r)]}
    if(cur!==''){toks.push(cur);cur=''}
    if(!toks.length)toks.push('0');
    if(isOp(toks.at(-1)))toks[toks.length-1]=k;else toks.push(k);
    if(armed&&k==='+'&&toks.filter(t=>!isOp(t)).length===S.n){armed=false;startForce()}
    return render()}
  if(k==='='){if(result!==null)return;
    if(force!==null){cur=force;force=null}
    if(cur!=='')toks.push(cur);cur='';if(!toks.length)return render();
    if(isOp(toks.at(-1)))toks.pop();
    shownExpr=exprStr(toks);result=evalToks(toks);toks=[];return render()}
}

/* touch: 0 key tap = 0, hold 0.7 s = secret settings */
const keys=document.getElementById('keys');let holdT=null,held=false,zeroDown=false;
function down(b){b.classList.add('down');
  if(b.dataset.k==='0'){zeroDown=true;held=false;holdT=setTimeout(()=>{held=true;b.classList.remove('down');openSheet()},700)}
  else press(b.dataset.k)}
function up(){document.querySelectorAll('.k.down').forEach(b=>b.classList.remove('down'));
  if(zeroDown){zeroDown=false;clearTimeout(holdT);if(!held)press('0')}}
keys.addEventListener('touchstart',e=>{const b=e.target.closest('.k');if(!b)return;e.preventDefault();down(b)},{passive:false});
keys.addEventListener('touchend',e=>{e.preventDefault();up()},{passive:false});
keys.addEventListener('touchcancel',up);
let touchUsed=false;addEventListener('touchstart',()=>touchUsed=true,{passive:true,capture:true});
keys.addEventListener('mousedown',e=>{if(touchUsed)return;const b=e.target.closest('.k');if(b)down(b)});
addEventListener('mouseup',()=>{if(!touchUsed)up()});

/* secret settings sheet */
const $=id=>document.getElementById(id);
function syncSheet(){
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.mode));
  $('customBox').classList.toggle('hide',S.mode!=='custom');$('dateBox').classList.toggle('hide',S.mode!=='date');
  $('custom').value=S.custom;$('fmt').value=S.fmt;$('aV').textContent=S.a;$('nV').textContent=S.n;
  $('prev').textContent='Result now: '+fmtNum(String(dateTarget()))}
function openSheet(){syncSheet();document.body.classList.add('open')}
function closeSheet(){
  S.custom=$('custom').value.replace(/\D/g,'');if(S.mode==='custom'&&!S.custom)S.mode='date';
  saveS();if(document.activeElement)document.activeElement.blur();document.body.classList.remove('open');
  if(!armed&&(force!==null||(cur===''&&toks.length&&toks.at(-1)==='+')))computeForce();
  render()}
$('done').onclick=closeSheet;$('sheetBg').onclick=closeSheet;
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.v;syncSheet()});
$('fmt').onchange=()=>{S.fmt=$('fmt').value;syncSheet()};
$('custom').oninput=()=>{S.custom=$('custom').value.replace(/\D/g,'')};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s,d=+b.dataset.d;
  S[k]=k==='n'?Math.min(9,Math.max(1,S[k]+d)):Math.min(30,Math.max(0,S[k]+d));syncSheet()});
setInterval(()=>{if(document.body.classList.contains('open')&&S.mode==='date')$('prev').textContent='Result now: '+fmtNum(String(dateTarget()))},5000);

document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('resize',render);
render();
</script>
</body>
</html>
