<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Notes</title>
<style>
:root{
  --bg:#F2F2F7;--cell:#FFFFFF;--page:#FFFFFF;--label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2);--tint:#E3A900;--glass:rgba(255,255,255,.74);--glassb:rgba(255,255,255,.95);
  --fill:rgba(118,118,128,.12);--press:rgba(0,0,0,.06);--shadow:0 4px 16px rgba(0,0,0,.09);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--cell:#1C1C1E;--page:#000;--label:#FFF;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--tint:#FFC90A;--glass:rgba(40,40,42,.72);--glassb:rgba(255,255,255,.14);
  --fill:rgba(118,118,128,.24);--press:rgba(255,255,255,.08);--shadow:0 4px 16px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--label);
  font-family:-apple-system,system-ui,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);transition:transform .45s cubic-bezier(.2,.85,.25,1);will-change:transform}
.screen.note{background:var(--page)}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-30%)}
.screen.drag{transition:none}
.screen .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
.screen.off-left .shade{opacity:.08}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:calc(env(safe-area-inset-top) + 58px);padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.nav{position:absolute;left:0;right:0;top:0;z-index:5;height:calc(env(safe-area-inset-top) + 60px);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.nav::before{content:"";position:absolute;inset:0 0 -14px;background:linear-gradient(var(--bg) 55%,transparent);opacity:0;transition:opacity .2s;pointer-events:none}
.note .nav::before{background:linear-gradient(var(--page) 55%,transparent)}
.nav.scrolled::before{opacity:1}
.nav>*{pointer-events:auto;position:relative}
.nav .mid{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 20px);transform:translateX(-50%);
  font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.nav.scrolled .mid{opacity:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:.5px solid var(--glassb);box-shadow:var(--shadow);border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--label)}
.glass:active{transform:scale(.94)}
.btn{width:44px;height:44px;transition:transform .15s}
.pill{height:44px;padding:0 4px}
.pill i{width:42px;height:44px;display:flex;align-items:center;justify-content:center}
.txtbtn{height:44px;padding:0 17px;font-size:17px}
.tint{color:var(--tint)}
svg{display:block}
.ltitle{font-size:34px;font-weight:700;letter-spacing:.35px;padding:4px 20px 10px;line-height:41px}
.search{margin:2px 16px 12px;height:38px;border-radius:999px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--sec);font-size:17px}
.search span{flex:1}
.sechead{font-size:20px;font-weight:700;padding:18px 20px 8px;letter-spacing:.2px}
.sechead.sm{font-size:22px}
.group{margin:0 16px;background:var(--cell);border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;padding:0 14px 0 16px;min-height:52px;position:relative}
.row:active,.nrow:active{background:var(--press)}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.row .ic{width:28px;color:var(--tint);margin-right:12px;display:flex;justify-content:center}
.row .nm{flex:1;font-size:17px}
.row .ct{color:var(--sec);font-size:17px;margin-right:8px}
.chev{color:var(--ter)}
.nrow{padding:11px 18px 11px 20px;position:relative}
.nrow+.nrow::before{content:"";position:absolute;top:0;left:20px;right:0;height:.5px;background:var(--sep)}
.nrow .t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:22px}
.nrow .s{font-size:15px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.nrow .s em{font-style:normal;color:var(--label);opacity:.82;margin-right:7px}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 16px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;align-items:center;justify-content:space-between;min-height:calc(env(safe-area-inset-bottom) + 60px);pointer-events:none}
.bar>*{pointer-events:auto}
.bar .count{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);font-size:12px;color:var(--label);opacity:.85}
.notebody{padding:6px 20px 0;-webkit-user-select:text;user-select:text}
.ndate{text-align:center;font-size:13px;color:var(--sec);padding:2px 0 14px}
.ntitle{font-size:28px;font-weight:700;line-height:34px;letter-spacing:.3px;margin-bottom:4px;word-wrap:break-word}
.ntext{font-size:17px;line-height:23px;white-space:pre-wrap;word-wrap:break-word}
.ntext .ck{display:flex;align-items:flex-start;gap:10px;margin:3px 0}
.ntext .ck b{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ter);margin-top:0}
.ntext .ck.on b{background:var(--tint);border-color:var(--tint);position:relative}
.ntext .ck.on b::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ntext .ck.on span{color:var(--sec)}
#hin{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;caret-color:transparent;color:transparent;background:transparent}
</style>
</head>
<body>
<div id="app"></div>
<input id="hin" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
<script>
/* ================== SETTINGS (edit these) ================== */
const DEFAULT_TOPIC = 'fvt-n-7q3k9xw2mz5r';   // must match r.html
const PRED_TITLE    = 'Note to self';         // title of the prediction note
const PRED_LEAD     = 'Don’t forget';    // first line (shows in the list preview)
const PRED_DAYS_AGO = 3;                      // how old the prediction note looks
const PRED_TIME     = '23:47';                // time on the prediction note
/* Other notes. daysAgo, time (24h), title, body. "[ ]" / "[x]" = checklist line */
const NOTES = [
  {daysAgo:0,  time:'08:12', title:'Groceries', body:'[x] Eggs\n[x] Coffee beans\n[ ] Almond milk\n[ ] Bananas\n[ ] Tortillas\n[ ] Paper towels'},
  {daysAgo:6,  time:'19:05', title:'Gift ideas', body:'Mom – candle set\nDad – new wallet\nSam – headphones\nLeo – Lego?'},
  {daysAgo:11, time:'14:30', title:'Books to read', body:'Project Hail Mary\nThe Midnight Library\nAtomic Habits\nDune'},
  {daysAgo:19, time:'07:44', title:'Workout', body:'Mon – chest + tris\nWed – back + bis\nFri – legs\nSat – cardio 30 min'},
  {daysAgo:34, time:'21:16', title:'Packing list', body:'[x] Chargers\n[x] Passport\n[ ] Sunglasses\n[ ] Toothbrush\n[ ] Hoodie'},
  {daysAgo:52, time:'12:02', title:'Wi‑Fi', body:'Network: Home_5G\nRouter is behind the TV'}
];
/* ========================================================== */

const Q = new URLSearchParams(location.search);
const TOPIC = Q.get('k') || DEFAULT_TOPIC;
const store = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
let pred = Q.get('p') ?? store.get('pred') ?? '';
const PDAYS = Q.has('d') ? +Q.get('d') : PRED_DAYS_AGO;
const PTITLE = Q.get('title') || PRED_TITLE;
const PLEAD = Q.has('lead') ? Q.get('lead') : PRED_LEAD;

const now = new Date();
function at(daysAgo, hm){const d=new Date(now);d.setDate(d.getDate()-daysAgo);const [h,m]=hm.split(':').map(Number);d.setHours(h,m,0,0);if(d>now)d.setTime(now-60000*7);return d}
const notes = NOTES.map((n,i)=>({id:'n'+i,title:n.title,body:n.body,date:at(n.daysAgo,n.time)}));
notes.push({id:'pred',title:PTITLE,body:null,date:at(PDAYS,PRED_TIME)});
notes.sort((a,b)=>b.date-a.date);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const dayDiff=d=>Math.round((new Date(now.toDateString())-new Date(d.toDateString()))/864e5);
const tfmt=d=>d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
function listDate(d){const k=dayDiff(d);if(k===0)return tfmt(d);if(k===1)return'Yesterday';if(k<7)return d.toLocaleDateString('en-US',{weekday:'long'});
  return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2)}
function longDate(d){return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+' at '+tfmt(d)}
function section(d){const k=dayDiff(d);if(k===0)return'Today';if(k===1)return'Yesterday';if(k<=7)return'Previous 7 Days';if(k<=30)return'Previous 30 Days';
  return d.getFullYear()===now.getFullYear()?d.toLocaleDateString('en-US',{month:'long'}):String(d.getFullYear())}
function bodyOf(n){return n.id==='pred' ? (PLEAD ? PLEAD+(pred?'\n\n'+pred:'') : pred) : n.body}
function preview(n){const b=bodyOf(n)||'';const l=b.split('\n').find(x=>x.trim());return l?l.replace(/^\[[ x]\] /,''):'No additional text'}

const I={
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>',
 compose:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4.5H7a2.5 2.5 0 0 0-2.5 2.5v10A2.5 2.5 0 0 0 7 19.5h10a2.5 2.5 0 0 0 2.5-2.5v-4.5"/><path d="M17.6 3.6a1.9 1.9 0 0 1 2.8 2.8l-7.6 7.6-3.6.9.9-3.6z"/></svg>',
 newfolder:'<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12V8.5a2 2 0 0 0-2-2h-7l-2-2.2H5.5a2 2 0 0 0-2 2v11.4a2 2 0 0 0 2 2H12"/><path d="M18 14.5v6M15 17.5h6"/></svg>',
 folder:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 7A2 2 0 0 1 5.5 5h3.7l2 2.1h7.3a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 9.6h17"/></svg>',
 trash:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9.5 6.5V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.7M6.5 6.5l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.2M10.2 10v6.5M13.8 10v6.5"/></svg>',
 chev:'<svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>',
 search:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',
 mic:'<svg width="15" height="19" viewBox="0 0 16 22" fill="currentColor"><rect x="4.5" y="1" width="7" height="12.5" rx="3.5"/><path d="M1.8 10.5a6.2 6.2 0 0 0 12.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M8 17v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
 share:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M8 7.2l4-3.9 4 3.9"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/></svg>',
 more:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>',
 checklist:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="7" r="2.3"/><path d="m4.4 7 .8.8 1.5-1.6"/><circle cx="5.5" cy="16.5" r="2.3"/><path d="M11 7h9M11 16.5h9"/></svg>',
 aa:'<svg width="26" height="22" viewBox="0 0 28 22" fill="currentColor"><text x="1" y="17" font-family="-apple-system,system-ui" font-size="17" font-weight="500">Aa</text></svg>',
 clip:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m20 11.2-7.8 7.8a5 5 0 0 1-7.1-7.1l8.2-8.2a3.4 3.4 0 0 1 4.8 4.8l-8.1 8.1a1.7 1.7 0 0 1-2.4-2.4l7.4-7.4"/></svg>',
 pen:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.8 5.2 4 4M4 20l1-4.5L16.2 4.3a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L8.5 19z"/></svg>'
};

const app=document.getElementById('app');
const stack=[];
function mk(cls,html){const s=document.createElement('div');s.className='screen '+cls;s.innerHTML=html+'<div class="shade"></div>';
  const sc=s.querySelector('.scroll'),nav=s.querySelector('.nav');
  if(sc&&nav)sc.addEventListener('scroll',()=>nav.classList.toggle('scrolled',sc.scrollTop>(cls==='note'?6:38)),{passive:true});return s}

function foldersScreen(){
  const n=notes.length;
  const s=mk('folders',`
  <div class="nav"><span></span><span class="mid">Folders</span><div class="glass txtbtn">Edit</div></div>
  <div class="scroll">
    <div class="ltitle">Folders</div>
    <div class="search">${I.search}<span>Search</span>${I.mic}</div>
    <div class="sechead sm">iCloud</div>
    <div class="group">
      <div class="row" data-go="list"><span class="ic">${I.folder}</span><span class="nm">All iCloud</span><span class="ct">${n}</span><span class="chev">${I.chev}</span></div>
      <div class="row" data-go="list"><span class="ic">${I.folder}</span><span class="nm">Notes</span><span class="ct">${n}</span><span class="chev">${I.chev}</span></div>
      <div class="row"><span class="ic">${I.trash}</span><span class="nm">Recently Deleted</span><span class="ct">2</span><span class="chev">${I.chev}</span></div>
    </div>
  </div>
  <div class="bar"><div class="glass btn">${I.newfolder}</div><div class="glass btn tint">${I.compose}</div></div>`);
  s.querySelectorAll('[data-go=list]').forEach(r=>r.onclick=()=>push(listScreen()));
  return s}

function listRows(){
  let h='',cur=null;
  for(const n of notes){const sec=section(n.date);
    if(sec!==cur){if(cur!==null)h+='</div>';h+=`<div class="sechead">${esc(sec)}</div><div class="group">`;cur=sec}
    h+=`<div class="nrow" data-id="${n.id}"><div class="t">${esc(n.title)}</div><div class="s"><em>${esc(listDate(n.date))}</em>${esc(preview(n))}</div></div>`}
  return h+'</div>'}
function listScreen(){
  const s=mk('list',`
  <div class="nav"><div class="glass btn" data-back>${I.back}</div><span class="mid">Notes</span><div class="glass btn">${I.more}</div></div>
  <div class="scroll">
    <div class="ltitle" data-secret>Notes</div>
    <div class="search">${I.search}<span>Search</span>${I.mic}</div>
    <div class="rows">${listRows()}</div>
  </div>
  <div class="bar"><span></span><span class="count" data-secret>${notes.length} Notes</span><div class="glass btn tint">${I.compose}</div></div>`);
  wire(s);s.querySelectorAll('[data-secret]').forEach(secret);return s}

function renderBody(b){
  return esc(b||'').split('\n').map(l=>{const m=l.match(/^\[([ x])\] (.*)$/);
    return m?`<div class="ck${m[1]==='x'?' on':''}"><b></b><span>${m[2]}</span></div>`:(l===''?'<div>&nbsp;</div>':`<div>${l}</div>`)}).join('')}
function noteScreen(n){
  const s=mk('note',`
  <div class="nav"><div class="glass btn" data-back>${I.back}</div><div class="glass pill"><i>${I.share}</i><i>${I.more}</i></div></div>
  <div class="scroll"><div class="notebody">
    <div class="ndate">${esc(longDate(n.date))}</div>
    <div class="ntitle">${esc(n.title)}</div>
    <div class="ntext" ${n.id==='pred'?'id="pbody"':''}>${renderBody(bodyOf(n))}</div>
  </div></div>
  <div class="bar"><div class="glass pill"><i>${I.checklist}</i><i>${I.aa}</i><i>${I.clip}</i><i>${I.pen}</i></div><div class="glass btn tint">${I.compose}</div></div>`);
  wire(s);return s}

function wire(s){
  const b=s.querySelector('[data-back]');if(b)b.onclick=pop;
  s.querySelectorAll('.nrow').forEach(r=>r.onclick=()=>{const n=notes.find(x=>x.id===r.dataset.id);push(noteScreen(n))})}

function push(el,instant){
  const prev=stack[stack.length-1];stack.push(el);
  if(instant||!prev){app.appendChild(el);return}
  el.classList.add('off-right');app.appendChild(el);el.offsetWidth;
  el.classList.remove('off-right');prev.classList.add('off-left')}
function pop(){
  if(stack.length<2)return;const top=stack.pop(),prev=stack[stack.length-1];
  top.classList.remove('drag');prev.classList.remove('drag');top.style.transform='';prev.style.transform='';
  top.classList.add('off-right');prev.classList.remove('off-left');
  setTimeout(()=>top.remove(),460);
  if(prev.classList.contains('list'))refreshList(prev)}
function refreshList(s){const r=s.querySelector('.rows');if(r){r.innerHTML=listRows();wire(s)}}

/* edge swipe to go back */
(function(){let sx=0,sy=0,act=false,lx=0,lt=0,v=0;const W=()=>innerWidth;
  app.addEventListener('touchstart',e=>{const t=e.touches[0];if(stack.length>1&&t.clientX<28){act=true;sx=t.clientX;sy=t.clientY;lx=sx;lt=Date.now();
    stack.at(-1).classList.add('drag');stack.at(-2).classList.add('drag')}},{passive:true});
  app.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0];const dx=Math.max(0,t.clientX-sx);const n=Date.now();v=(t.clientX-lx)/Math.max(1,n-lt);lx=t.clientX;lt=n;
    stack.at(-1).style.transform=`translateX(${dx}px)`;stack.at(-2).style.transform=`translateX(${-30+30*dx/W()}%)`},{passive:true});
  app.addEventListener('touchend',()=>{if(!act)return;act=false;const top=stack.at(-1),prev=stack.at(-2);const dx=lx-sx;
    if(dx>W()*.35||v>.5){pop()}else{top.classList.remove('drag');prev.classList.remove('drag');top.style.transform='';prev.style.transform=''}})})();

/* prediction input */
function setPred(v){pred=v;store.set('pred',v);const pb=document.getElementById('pbody');
  if(pb){const n=notes.find(x=>x.id==='pred');pb.innerHTML=renderBody(bodyOf(n))}
  const l=stack.find(s=>s.classList.contains('list'));if(l&&l!==stack.at(-1))refreshList(l)}
const hin=document.getElementById('hin');
function openHidden(){hin.value='';hin.focus()}
hin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();hin.blur()}});
hin.addEventListener('blur',()=>{const v=hin.value.trim();if(v){setPred(v);const l=stack.find(s=>s.classList.contains('list'));if(l)refreshList(l)}hin.value=''});
function secret(el){let t0=0,moved=false;
  el.addEventListener('touchstart',()=>{t0=Date.now();moved=false},{passive:true});
  el.addEventListener('touchmove',()=>{moved=true},{passive:true});
  el.addEventListener('touchend',e=>{if(!moved&&Date.now()-t0>650){e.preventDefault();openHidden()}});
  el.addEventListener('mousedown',()=>{t0=Date.now()});
  el.addEventListener('mouseup',()=>{if(Date.now()-t0>650)openHidden()})}

/* remote input (r.html) */
(function(){if(Q.get('remote')==='0'||!window.EventSource)return;
  function go(){try{const es=new EventSource('https://ntfy.sh/'+encodeURIComponent(TOPIC)+'/sse?since=20m');
    es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event&&m.event!=='message')return;if(typeof m.message!=='string')return;
      setPred(m.message==='_clear_'?'':m.message)}catch(_){}};
    es.onerror=()=>{if(es.readyState===2){setTimeout(go,3000)}}}catch(_){}}
  go()})();

/* start */
const start=Q.get('start')||'list';
push(foldersScreen(),true);
if(start!=='folders'){push(listScreen(),true);stack[0].classList.add('off-left')}
if(start==='note'){push(noteScreen(notes.find(x=>x.id==='pred')),true);stack[1].classList.add('off-left')}
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
